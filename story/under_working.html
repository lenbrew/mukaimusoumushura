<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事中 角色故事 - 無界無双無修羅</title>
<style>
  /* 沿用你首頁的極簡日式美學與色彩變數 */
  :root {
    --paper: #ffffff;
    --ink: #1c1c1c;
    --ink-soft: #6b6459;
    --card: #faf8f5;
    --line: #e7e2da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-weight: 700;
    margin: 0;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* 返回導覽列 */
  .back-nav {
    padding: 32px 0 16px;
  }

  .back-link {
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 14px;
    transition: color 0.15s ease;
  }

  .back-link:hover {
    color: var(--ink);
  }

  /* 角色標頭區 */
  .character-hero {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 0 40px;
    border-bottom: 1px solid var(--line);
  }

  .character-hero img {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .character-info h1 {
    font-size: 24px;
    margin-bottom: 6px;
  }

  .character-info p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* 故事折疊清單區 */
  .story-section {
    padding: 32px 0 80px;
  }

  .section-title {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  /* 單篇故事卡片（含收合設計） */
  .story-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }

  .story-item:hover {
    border-color: var(--ink);
  }

  /* 故事標題列（點擊可展開） */
  .story-header {
    padding: 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }

  .story-title-group h3 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .story-subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* 展開/收合的箭頭圖示 */
  .story-arrow {
    font-size: 14px;
    color: var(--ink-soft);
    transition: transform 0.2s ease;
  }

  /* 故事內文區（預設隱藏） */
  .story-content {
    max-height: 0;
    overflow: hidden;
    padding: 0 20px;
    border-top: 1px solid transparent;
    transition: max-height 0.3s ease, padding 0.3s ease, border-color 0.3s ease;
    font-size: 15px;
/* 加上這行，就能保留你原本打字時的 Enter 換行與段落 */
  white-space: pre-line;
  }

  /* 當故事展開時的樣式 */
  .story-item.active .story-content {
    max-height: 6000px; /* 足夠容納文章高度的上限 */
    padding: 20px;
    border-top-color: var(--line);
  }

  .story-item.active .story-arrow {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- 返回首頁 -->
  <div class="back-nav">
    <a href="../index.html" class="back-link">← 返回首頁</a>
  </div>

  <!-- 角色簡介 -->
  <section class="character-hero">
    <img src="../image/bg_slash.png" alt="烏香卡．艾伐">
    <div class="character-info">
      <h1>工事中</h1>
      <p>​工事中</p>
    </div>
  </section>

  <!-- 故事清單區（展開/收合） -->
  <section class="story-section">
    <div class="section-title">修羅文庫 / 角色故事集</div>

    <!-- 故事 1 -->
    <div class="story-item">
      <div class="story-header" onclick="toggleStory(this)">
        <div class="story-title-group">
          <h3>工事中</h3>
          <p class="story-subtitle">工事中</p>
        </div>
        <div class="story-arrow">▼</div>
      </div>
      <div class="story-content">
        <p>
工事中


</p>

      </div>
    </div>



    <!-- 若未來有第三篇、第四篇，直接複製上面整塊 <div class="story-item">...</div> 貼上即可 -->

  </section>
</div>

<script>
  function toggleStory(headerElement) {
    const item = headerElement.parentElement;
    
    // 如果希望每次只能展開一篇（其他的自動收合），可以把下面這段註解拿掉：
    /*
    document.querySelectorAll('.story-item').forEach(el => {
      if (el !== item) el.classList.remove('active');
    });
    */

    // 切換當前故事的展開/收合狀態
    item.classList.toggle('active');
  }
</script>

</body>
</html>
