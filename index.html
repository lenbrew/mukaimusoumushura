<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無界無双無修羅</title>


<script>
    // 自動偵測語系，日文環境跳轉到日文版
    var userLang = navigator.language || '';
    
    // 檢查是否為日文語系，且沒有手動指定切換回中文
    if (userLang.startsWith('ja') && !window.location.search.includes('lang=zh')) {
        // 使用 replace 替代 href，避免「上一頁」陷入無限跳轉的死局
        window.location.replace("index_jp.html");
    }
</script>

<!--
=====================================================================
  這個網頁怎麼編輯？
=====================================================================
  跟你的個人頁面(index.html)是同一套寫法、同一套顏色設定，
  只是拿掉了紅色毛筆筆畫的裝飾。

  找地方改，一樣用 Ctrl+F / Cmd+F 搜尋這些關鍵字：

    【改圖片】   → sell_sheet.jpg 的路徑，換成你的最新宣傳圖
    【改連結】   → 規則頁面、日文版頁面的連結
    【改更新履歷】→ changelog-list 底下的每一條紀錄

  顏色設定一樣集中在 <style> 開頭的 :root 區塊，要改色只需要改那幾行。
=====================================================================
-->

<style>
  :root {
    --paper: #ffffff;
    --ink: #1c1c1c;
    --ink-soft: #6b6459;
    --card: #faf8f5;
    --line: #e7e2da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-weight: 700;
    margin: 0;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- Hero / 標題區 ---------- */
  .hero {
    padding: 64px 0 8px;
    border-bottom: 1px solid var(--line);
  }

  .hero h1 {
    font-size: 30px;
  }

  /* ---------- 圖片展示區 ---------- */
  .showcase {
    padding: 40px 0;
  }

  .thumbnail {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 2px;
    cursor: zoom-in;
    background: var(--card);
    border: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .thumbnail:last-of-type {
    margin-bottom: 0;
  }

  .showcase-hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- 導覽列 ---------- */
  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 8px 0 40px;
  }

  .nav-link {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    color: var(--ink);
    font-size: 14px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-link:hover {
    background: var(--ink);
    color: var(--paper);
  }

  /* ---------- 角色故事區 ---------- */
  .characters {
    padding: 32px 0 40px;
    border-top: 1px solid var(--line);
  }

  .character-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 20px;
  }

  .character-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--ink);
    text-align: center;
  }

  .character-card img {
    width: 88px;
    height: 88px;
    object-fit: cover;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .character-card .character-name {
    margin-top: 10px;
    font-family: "Noto Serif TC", serif;
    font-size: 13px;
  }

  .character-card:hover img {
    border-color: var(--ink);
  }

  /* ---------- 更新履歷 ---------- */
  .changelog {
    padding: 32px 0 80px;
    border-top: 1px solid var(--line);
  }

  .section-title {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  .changelog-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }

  .changelog-list li {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }

  .changelog-list li:last-child { border-bottom: none; }

  .changelog-list strong {
    font-family: "Noto Serif TC", serif;
    margin-right: 10px;
  }

  /* ---------- 燈箱 (Lightbox) ---------- */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 999;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(20, 18, 15, 0.92);
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    cursor: zoom-out;
  }

  .lightbox.active { display: flex; }

  .lightbox-img {
    max-width: 100%;
    height: auto;
    padding: 32px 16px;
  }

  @media (max-width: 480px) {
    .hero { padding: 48px 0 8px; }
    .hero h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- ============ 標題區 ============ -->
<section class="hero">
  <div class="wrap">
    <h1>無界無双無修羅</h1>
  </div>
</section>

<!-- ============ 宣傳圖展示區 ============ -->
<section class="showcase">
  <div class="wrap">
    <!-- 【改圖片】每張圖都用 class="thumbnail"，不需要id；新增圖片直接複製一行 <img> 貼上即可 -->
    <img src="image/boothcut_RGB.png" alt="無界無双無修羅" class="thumbnail">
    <img src="image/1minmushurai_1.jpg" alt="一分鐘無修羅" class="thumbnail">
    <img src="image/1minmushurai_2.jpg" alt="一分鐘無修羅" class="thumbnail">
    <img src="image/1minmushurai_3.jpg" alt="一分鐘無修羅" class="thumbnail">
    <img src="image/1minmushurai_4.jpg" alt="一分鐘無修羅" class="thumbnail">
    <div class="showcase-hint">點擊圖片放大檢視</div>
  </div>
</section>

<!-- ============ 導覽列 ============ -->
<nav class="nav-bar">
  <div class="wrap" style="display:flex; gap:14px; flex-wrap:wrap;">
    <!-- 【改連結】換成實際的規則頁面、日文版連結 -->
    <a href="rules.html" class="nav-link">遊戲規則</a>
    <a href="index_jp.html" class="nav-link">日本語で表示</a>
  </div>
</nav>

<!-- ============ 角色故事區 ============ -->
<section class="characters">
  <div class="wrap">
    <div class="section-title">角色故事</div>
    <div class="character-grid">
      <!-- 【改角色】複製一整塊 <a class="character-card">...</a>，換圖片路徑、連結、名字即可 -->
      <a class="character-card" href="https://example.com/replace-with-real-link" target="_blank" rel="noopener">
        <img src="https://placehold.co/200x200/faf8f5/6b6459?text=烏香卡" alt="烏香卡頭像">
        <div class="character-name">烏香卡</div>
      </a>
      <a class="character-card" href="https://example.com/replace-with-real-link" target="_blank" rel="noopener">
        <img src="https://placehold.co/200x200/faf8f5/6b6459?text=凱蒂" alt="凱蒂頭像">
        <div class="character-name">凱蒂</div>
      </a>
      <a class="character-card" href="https://example.com/replace-with-real-link" target="_blank" rel="noopener">
        <img src="https://placehold.co/200x200/faf8f5/6b6459?text=山越凜鬼" alt="山越凜鬼頭像">
        <div class="character-name">山越凜鬼</div>
      </a>
      <a class="character-card" href="https://example.com/replace-with-real-link" target="_blank" rel="noopener">
        <img src="https://placehold.co/200x200/faf8f5/6b6459?text=露忒" alt="露忒頭像">
        <div class="character-name">露忒·薩路基</div>
      </a>
      <!--
        再新增角色，直接複製上面一整塊
        <a class="character-card" ...> ... </a>
        貼在下面、改內容即可，格線會自動換行排列。
      -->
    </div>
  </div>
</section>

<!-- ============ 更新履歷 ============ -->
<section class="changelog">
  <div class="wrap">
    <div class="section-title">更新履歷 / Changelog</div>
    <!-- 【改更新履歷】在下面新增/修改 <li> 項目即可 -->
    <ul class="changelog-list">
      <li><strong>2026.XX.XX</strong>更新規則說明與最新平衡調整。</li>
      <li><strong>2026.XX.XX</strong>調整版面配置與美術宣傳圖。</li>
    </ul>
  </div>
</section>

<!-- ============ 燈箱(點圖放大) ============ -->
<div class="lightbox" id="lightbox">
  <img src="" alt="無界無双無修羅" class="lightbox-img" id="lightboxImg">
</div>

<script>
  const thumbnails = document.querySelectorAll('.thumbnail');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  thumbnails.forEach((thumb) => {
    thumb.addEventListener('click', () => {
      lightboxImg.src = thumb.src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  });
</script>

</body>
</html>
